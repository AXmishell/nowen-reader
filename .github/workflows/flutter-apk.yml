name: Build Android APK (manual)

# 手动触发打包 Android 产物（APK / AAB）。
# 之所以放在 CI：本地工具链（JDK/NDK/Gradle 版本组合）容易冲突，CI 用固定的
# JDK 17 + 固定的 Flutter 版本 + 预装 Android SDK，产物可复现、可下载。
on:
  workflow_dispatch:
    inputs:
      build_type:
        description: '构建产物类型'
        required: true
        default: apk
        type: choice
        options:
          - apk
          - appbundle
      build_mode:
        description: '构建模式（release 开启 R8 混淆；混淆报错时可先用 debug 验证）'
        required: true
        default: release
        type: choice
        options:
          - release
          - debug
      split_per_abi:
        description: '按 ABI 拆分 APK（仅 apk 有效，产出 arm64-v8a / armeabi-v7a / x86_64）'
        required: true
        default: false
        type: boolean

env:
  # 构建所用的 Flutter 版本。固定在此处（不作为手动输入，避免被误填成项目版本号之类
  # 的非法值）。升级时只改这一处即可 —— NDK 版本会在构建前从该 SDK 动态读取。
  FLUTTER_VERSION: '3.47.5'
  # 兜底值：仅当无法从 Flutter SDK 读取到所需 NDK 版本时才使用。
  NDK_VERSION_FALLBACK: '28.2.13676358'

permissions:
  contents: read

concurrency:
  group: flutter-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ inputs.build_type }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    defaults:
      run:
        working-directory: flutter_app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        # AGP 8.13 / Gradle 8.14 不支持 Java 25（Android Studio 自带 JBR 已是 25），
        # 因此显式使用 JDK 17。
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve and install the Android NDK required by Flutter
        id: ndk
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"

          # Flutter 在 flutter_tools 中声明了它要求的 NDK 版本
          # （packages/flutter_tools/lib/src/android/gradle_utils.dart: const ndkVersion = '...'）。
          # 这里动态读取，升级 Flutter 后无需手工同步 NDK 版本。
          FLUTTER_ROOT_DIR="${FLUTTER_ROOT:-$(dirname "$(dirname "$(command -v flutter)")")}"
          GRADLE_UTILS="$FLUTTER_ROOT_DIR/packages/flutter_tools/lib/src/android/gradle_utils.dart"

          NDK_REQUIRED=""
          if [ -f "$GRADLE_UTILS" ]; then
            NDK_REQUIRED="$(grep -oP "const ndkVersion = '\K[^']+" "$GRADLE_UTILS" | head -n 1 || true)"
          fi

          if [ -z "$NDK_REQUIRED" ]; then
            NDK_REQUIRED="${NDK_VERSION_FALLBACK}"
            echo "::warning::未能从 Flutter SDK 读取 NDK 版本（$GRADLE_UTILS），回退到 ${NDK_REQUIRED}"
          else
            echo "[ndk] Flutter ${FLUTTER_VERSION} 要求 NDK: ${NDK_REQUIRED}"
          fi

          # AGP 会校验该 NDK 是否存在，缺失时构建直接失败，因此提前装好。
          if [ -d "$SDK/ndk/${NDK_REQUIRED}" ]; then
            echo "[ndk] 已存在，跳过安装"
          else
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" --install "ndk;${NDK_REQUIRED}"
          fi

          echo "[ndk] 当前已安装的 NDK："
          ls -1 "$SDK/ndk"
          echo "ndk_version=${NDK_REQUIRED}" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        # 仓库存在既有 warning/info（非本次改动引入），此处只作为门禁，
        # 不因既有告警失败；真正的 error 仍会导致失败。
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build
        run: |
          set -euo pipefail
          MODE="${{ inputs.build_mode }}"
          if [ "${{ inputs.build_type }}" = "appbundle" ]; then
            flutter build appbundle "--${MODE}"
          elif [ "${{ inputs.split_per_abi }}" = "true" ]; then
            flutter build apk "--${MODE}" --split-per-abi
          else
            flutter build apk "--${MODE}"
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nowen-reader-${{ inputs.build_type }}-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 30
          path: |
            flutter_app/build/app/outputs/flutter-apk/*.apk
            flutter_app/build/app/outputs/bundle/**/*.aab

      - name: Summary
        working-directory: .
        run: |
          {
            echo "### Android build finished"
            echo ""
            echo "- Type: \`${{ inputs.build_type }}\`"
            echo "- Mode: \`${{ inputs.build_mode }}\`"
            echo "- Split per ABI: \`${{ inputs.split_per_abi }}\`"
            echo "- Flutter: \`${FLUTTER_VERSION}\`"
            echo "- NDK: \`${{ steps.ndk.outputs.ndk_version }}\`"
            echo "- Artifact: \`nowen-reader-${{ inputs.build_type }}-${{ github.run_number }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
