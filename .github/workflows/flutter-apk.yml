name: Build Android APK (manual)

# 手动触发打包 Android 产物（APK / AAB）。
# 之所以放在 CI：本地工具链（JDK/NDK/Gradle 版本组合）容易冲突，CI 用固定的
# JDK 17 + 固定 Flutter 版本 + 预装 Android SDK，产物可复现、可下载。
on:
  workflow_dispatch:
    inputs:
      build_type:
        description: '构建产物类型'
        required: true
        default: apk
        type: choice
        options:
          - apk
          - appbundle
      build_mode:
        description: '构建模式（release 开启 R8 混淆；混淆报错时可先用 debug 验证）'
        required: true
        default: release
        type: choice
        options:
          - release
          - debug
      split_per_abi:
        description: '按 ABI 拆分 APK（仅 apk 有效，产出 arm64-v8a / armeabi-v7a / x86_64）'
        required: true
        default: false
        type: boolean
      flutter_version:
        description: 'Flutter 版本（需与该版本要求的 NDK 一致，见下方 NDK_VERSION）'
        required: true
        default: '3.47.5'
        type: string

env:
  # Flutter 3.47.5 的 flutter.ndkVersion；AGP 会校验该 NDK 是否存在，
  # 因此必须在构建前装好，避免 Gradle 自动下载失败。
  NDK_VERSION: '28.2.13676358'

permissions:
  contents: read

concurrency:
  group: flutter-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ inputs.build_type }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    defaults:
      run:
        working-directory: flutter_app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ inputs.flutter_version }}
          channel: stable
          cache: true

      - name: Install Android NDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "ndk;${NDK_VERSION}"
          # 回显实际安装的 NDK，便于排查版本不一致
          ls -1 "$SDK/ndk"

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        # 仓库存在既有 warning/info（非本次改动引入），此处只作为门禁，
        # 不因既有告警失败；真正的 error 仍会导致失败。
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build
        run: |
          set -euo pipefail
          MODE="${{ inputs.build_mode }}"
          if [ "${{ inputs.build_type }}" = "appbundle" ]; then
            flutter build appbundle "--${MODE}"
          elif [ "${{ inputs.split_per_abi }}" = "true" ]; then
            flutter build apk "--${MODE}" --split-per-abi
          else
            flutter build apk "--${MODE}"
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nowen-reader-${{ inputs.build_type }}-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 30
          path: |
            flutter_app/build/app/outputs/flutter-apk/*.apk
            flutter_app/build/app/outputs/bundle/**/*.aab

      - name: Summary
        working-directory: .
        run: |
          {
            echo "### Android build finished"
            echo ""
            echo "- Type: \`${{ inputs.build_type }}\`"
            echo "- Mode: \`${{ inputs.build_mode }}\`"
            echo "- Split per ABI: \`${{ inputs.split_per_abi }}\`"
            echo "- Flutter: \`${{ inputs.flutter_version }}\`"
            echo "- NDK: \`${NDK_VERSION}\`"
            echo "- Artifact: \`nowen-reader-${{ inputs.build_type }}-${{ github.run_number }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
